[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archetype-symbolic-reasoning"
version = "0.1.0"
description = "Neuro-symbolic reasoning and deterministic grounding over formal archetypal symbolic systems."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
archetype-mcp = "archetype_symbolic.mcp_server:main"

[project.entry-points."rat.plugins"]
divination = "archetype_symbolic.rat_plugin:DivinationToolPack"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/archetype_symbolic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
